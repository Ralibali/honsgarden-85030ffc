name: Affiliate coverage report

# Report of which catalog products the blog can place in each article,
# sorted by 30-day views. Read-only: uses the public publishable key.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/eloquent-keller-1a8htr
    paths:
      - scripts/affiliate-coverage.ts
      - .github/workflows/affiliate-coverage.yml

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --replace-registry-host=always
      - name: Build report
        run: npx tsx scripts/affiliate-coverage.ts
        env:
          COVERAGE_JSON: '1'
          VITE_SUPABASE_URL: https://sikbymtrbhrofysgkqsj.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpa2J5bXRyYmhyb2Z5c2drcXNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2NjQ0MjAsImV4cCI6MjA4ODI0MDQyMH0.SlgJoYwkD5GWeZ2mK-GihDvEWpt8noKWE8xulzSOqaU
