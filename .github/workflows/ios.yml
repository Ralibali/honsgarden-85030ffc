name: iOS build verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --replace-registry-host=always
      - name: Build bundled web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://sikbymtrbhrofysgkqsj.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpa2J5bXRyYmhyb2Z5c2drcXNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2NjQ0MjAsImV4cCI6MjA4ODI0MDQyMH0.SlgJoYwkD5GWeZ2mK-GihDvEWpt8noKWE8xulzSOqaU
          VITE_SUPABASE_PROJECT_ID: sikbymtrbhrofysgkqsj
      - name: Sync native dependencies
        run: npx cap sync ios
      - name: Check release configuration
        run: node scripts/native-readiness.mjs --check
      - name: Compile Release for iPhone without signing
        run: |
          xcodebuild -version
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .mobile-build/ios -jobs 2 \
            CODE_SIGNING_ALLOWED=NO build | tee ios-build.log
      - name: Save compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-compiler-log
          path: ios-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Report release gate
        run: |
          echo 'Release compiled for iPhone. Signing, TestFlight upload and App Store review are still required.' >> "$GITHUB_STEP_SUMMARY"
