name: Support relay safety
on:
  pull_request:
    paths:
      - "supabase/migrations/*support_source_relay.sql"
      - "supabase/tests/support-relay.mjs"
      - ".github/workflows/support-relay.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/*support_source_relay.sql"
      - "supabase/tests/support-relay.mjs"
      - ".github/workflows/support-relay.yml"
permissions:
  contents: read
jobs:
  support-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run --node-modules-dir=none --no-config --no-lock --allow-read --allow-env supabase/tests/support-relay.mjs
