name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_rls:
        description: "Kör manuella RLS-tester mot TEST_DB_URL"
        required: false
        default: "false"

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

  rls:
    name: RLS manual tests (test DB)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_rls == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run RLS SQL script
        env:
          TEST_DB_URL: ${{ secrets.TEST_DB_URL }}
        run: |
          if [ -z "$TEST_DB_URL" ]; then
            echo "TEST_DB_URL secret saknas — hoppar över."; exit 0
          fi
          psql "$TEST_DB_URL" -v ON_ERROR_STOP=1 -f tests/rls/manual-rls-test.sql
